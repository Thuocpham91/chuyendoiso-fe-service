services:
  chuyendoiso-fe-service:
    image: chuyendoiso-fe-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chuyendoiso-fe-service
    ports:
      - "${FE_PORT}:80"
    restart: always
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: ${VIRTUAL_PORT}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - gasy-network

networks:
  gasy-network:
    name: gasy-network
    external: true
